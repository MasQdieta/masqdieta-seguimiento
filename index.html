<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MásQdieta — Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#E8477A;--pink-dark:#C03060;--pink-light:#FBE8EF;
  --navy:#0D2B3E;--navy-light:#1A3C5A;
  --bg:#FDF5F7;--text:#0D2B3E;--text3:#A07090;
  --border:#EDD0DA;--radius:20px;
  --shadow:0 8px 32px rgba(232,71,122,0.15);
}
[data-theme="dark"]{
  --bg:#160A0F;--text:#F0D8E4;--text3:#805060;
  --navy:#1A0A12;--navy-light:#2A1020;
  --pink-light:#2A0F1A;--border:#3A1828;
  --shadow:0 8px 32px rgba(0,0,0,0.4);
}
html,body{min-height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s}

.bg-decor{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg-circle{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(232,71,122,0.08),transparent 70%)}
.bg-circle:nth-child(1){width:600px;height:600px;top:-200px;right:-200px}
.bg-circle:nth-child(2){width:400px;height:400px;bottom:-100px;left:-100px}

.toggle-wrap{position:fixed;top:16px;right:16px;z-index:100}
.toggle{position:relative;width:34px;height:19px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.t-track{position:absolute;inset:0;background:#EDD0DA;border-radius:20px;transition:.25s}
.toggle input:checked~.t-track{background:var(--pink)}
.t-thumb{position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle input:checked~.t-thumb{left:17.5px}

.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}

.logo-area{text-align:center;margin-bottom:48px}
.logo-img{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--pink);box-shadow:0 0 0 6px rgba(232,71,122,0.12);margin-bottom:20px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(232,71,122,0.12)}50%{box-shadow:0 0 0 12px rgba(232,71,122,0.06)}}
.logo-title{font-family:'Playfair Display',serif;font-size:42px;font-weight:700;background:linear-gradient(135deg,var(--pink),var(--pink-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;margin-bottom:8px}
.logo-sub{font-size:15px;color:var(--text3);letter-spacing:.05em;font-weight:400}

.buttons{display:flex;flex-direction:column;gap:16px;width:100%;max-width:360px}
.btn-main{display:flex;align-items:center;gap:16px;padding:22px 24px;border:none;border-radius:var(--radius);cursor:pointer;font-family:inherit;text-decoration:none;transition:all .2s;position:relative;overflow:hidden}
.btn-main::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);opacity:0;transition:.2s}
.btn-main:hover::after{opacity:1}
.btn-main:hover{transform:translateY(-3px)}
.btn-main:active{transform:translateY(0)}
.btn-alta{background:linear-gradient(135deg,var(--pink),var(--pink-dark));box-shadow:0 8px 24px rgba(232,71,122,0.35)}
.btn-seguimiento{background:linear-gradient(135deg,var(--navy-light),var(--navy));box-shadow:0 8px 24px rgba(13,43,62,0.3)}
[data-theme="dark"] .btn-seguimiento{box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.btn-icon{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.btn-text{text-align:left;flex:1}
.btn-label{display:block;font-size:18px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:3px}
.btn-desc{display:block;font-size:13px;color:rgba(255,255,255,0.65);font-weight:400}
.btn-arrow{font-size:20px;color:rgba(255,255,255,0.5);flex-shrink:0;transition:.2s}
.btn-main:hover .btn-arrow{color:rgba(255,255,255,0.9);transform:translateX(4px)}

.footer{margin-top:40px;text-align:center;font-size:12px;color:var(--text3)}

@media(max-width:480px){
  .logo-title{font-size:34px}
  .logo-img{width:74px;height:74px}
  .logo-area{margin-bottom:36px}
  .btn-label{font-size:16px}
}
</style>
</head>
